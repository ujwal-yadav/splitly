<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Refresh Splitly</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f6f2;
        color: #1d3029;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        padding: 24px;
        text-align: center;
        max-width: 360px;
      }
      h1 {
        color: #246f58;
        font-size: 26px;
      }
      p {
        line-height: 1.5;
      }
      a {
        color: #246f58;
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <h1>Splitly</h1>
      <p id="status">Refreshing the app…</p>
      <p>Your account and saved data will stay intact.</p>
      <noscript><p>Enable JavaScript, then reload this page.</p></noscript>
    </main>
    <script>
      (async () => {
        // Remove obsolete offline app bundles, never authentication or ledger storage.
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        const destination = '/?refresh=' + Date.now();
        await fetch(destination, { cache: 'reload' });
        window.location.replace(destination);
      })().catch(() => {
        document.getElementById('status').textContent =
          'Could not finish refreshing. Check your connection and reload this page.';
      });
    </script>
  </body>
</html>
